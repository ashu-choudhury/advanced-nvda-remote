[package]
name = "p2p_webrtc"
version = "0.1.0"
edition = "2021"

[lib]
name = "p2p_webrtc"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22.6", features = ["extension-module", "abi3-py310"] }
tokio = { version = "1.38", features = ["full"] }
webrtc = "0.17.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
cpal = "0.15"
opus = "0.3"
sonora = "0.1"
bytes = "1.6"
